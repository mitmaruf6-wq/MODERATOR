<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARUF Moderator Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#05080e',
                        cardBg: '#0b1220',
                    },
                    backgroundImage: {
                        'mod-gradient': 'linear-gradient(135deg, #38bdf8 0%, #0284c7 100%)',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', 'Inter', sans-serif; background-color: #05080e; color: #F1F5F9; }
        .font-english { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-darkBg text-slate-100 flex flex-col justify-between">

    <div id="toastBox" class="fixed bottom-6 right-6 z-50 max-w-sm w-[calc(100%-3rem)] transform translate-y-28 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-slate-900/95 backdrop-blur-md border border-sky-400/40 rounded-2xl p-4 shadow-2xl flex items-start gap-3">
            <div class="w-9 h-9 rounded-xl bg-sky-400/20 text-sky-400 flex items-center justify-center shrink-0 mt-0.5">
                <i class="fa-solid fa-circle-check text-lg"></i>
            </div>
            <div class="flex-1 text-left">
                <h4 id="toastTitle" class="text-sm font-bold text-slate-100">সফল হয়েছে</h4>
                <p id="toastMessage" class="text-xs text-slate-300 mt-1"></p>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-cardBg/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-mod-gradient p-[1.5px] flex items-center justify-center">
                    <div class="w-full h-full bg-darkBg rounded-[10px] flex items-center justify-center font-english font-black text-lg text-sky-400">M</div>
                </div>
                <div>
                    <h1 class="font-english text-base sm:text-lg font-black text-white">MODERATOR <span class="text-sky-400">PORTAL</span></h1>
                    <p class="text-[11px] text-slate-400">কাস্টমার ইউজার কন্ট্রোল সেন্টার</p>
                </div>
            </div>
            <button id="modLogoutBtn" onclick="logoutModerator()" class="hidden px-3.5 py-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-xs text-rose-400 font-bold border border-rose-500/30 transition flex items-center gap-1.5">
                <i class="fa-solid fa-right-from-bracket"></i> <span>লগআউট</span>
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto w-full px-4 py-6 flex-grow">
        <!-- LOGIN VIEW -->
        <div id="modLoginView" class="max-w-md mx-auto my-8 bg-cardBg border border-slate-800 rounded-3xl p-7 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-sky-500/10 border border-sky-500/30 text-sky-400 flex items-center justify-center text-2xl">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 class="text-xl font-extrabold text-white font-english">মডারেটর লগইন</h2>
                <p class="text-xs text-slate-400">আপনার ইউজারনেম এবং পাসওয়ার্ড দিয়ে প্রবেশ করুন</p>
            </div>
            <form onsubmit="handleModLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">ইউজারনেম</label>
                    <input type="text" id="modUser" required placeholder="যেমন: moderator1" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-sm text-slate-100 focus:border-sky-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">পাসওয়ার্ড (ডিফল্ট: mod123)</label>
                    <input type="password" id="modPass" required placeholder="পাসওয়ার্ড দিন" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-sm text-slate-100 focus:border-sky-400 focus:outline-none">
                    <p id="modLoginError" class="hidden text-xs text-rose-400 mt-2 font-semibold">❌ ভুল ইউজারনেম বা পাসওয়ার্ড!</p>
                </div>
                <button type="submit" class="w-full py-3.5 rounded-xl bg-mod-gradient text-slate-950 font-extrabold text-sm shadow-lg">লগইন করুন</button>
            </form>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="modDashboardView" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <!-- Add User & Change Password Box -->
                <div class="md:col-span-2 bg-cardBg border border-slate-800 rounded-3xl p-6 space-y-5">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                        <h3 class="text-sm font-bold text-sky-400"><i class="fa-solid fa-user-plus mr-1.5"></i> নতুন কাস্টমার ইউজার তৈরি করুন</h3>
                        <span class="text-xs text-slate-400">মডারেটর: <strong id="loggedInModName" class="text-white"></strong></span>
                    </div>

                    <form onsubmit="addUserByMod(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">কাস্টমার ইউজারনেম</label>
                            <input type="text" id="newClientUser" required placeholder="যেমন: user_rahim" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-xs focus:border-sky-400 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">কাস্টমার পাসওয়ার্ড</label>
                            <input type="text" id="newClientPass" required placeholder="যেমন: pass999" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-xs focus:border-sky-400 focus:outline-none">
                        </div>
                        <button type="submit" class="sm:col-span-2 py-3.5 rounded-xl bg-mod-gradient text-slate-950 font-bold text-xs shadow">ইউজার সেভ করুন</button>
                    </form>
                </div>

                <!-- Password Change Box -->
                <div class="bg-cardBg border border-slate-800 rounded-3xl p-6 space-y-4">
                    <h3 class="text-sm font-bold text-amber-400 border-b border-slate-800 pb-3"><i class="fa-solid fa-key mr-1.5"></i> প্যানেল পাসওয়ার্ড পরিবর্তন</h3>
                    <form onsubmit="updateModPassword(event)" class="space-y-3">
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">নতুন পাসওয়ার্ড</label>
                            <input type="text" id="newModPasswordInput" required placeholder="নতুন পাসওয়ার্ড দিন" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs focus:outline-none">
                        </div>
                        <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs transition">পাসওয়ার্ড আপডেট করুন</button>
                    </form>
                </div>
            </div>

            <!-- Users List Section -->
            <div class="bg-cardBg border border-slate-800 rounded-3xl p-6 space-y-4">
                <h3 class="text-sm font-bold text-slate-200">সকল কাস্টমার অ্যাকাউন্ট তালিকা</h3>
                <div id="modUsersList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMG7elkedXB4HS9H4CcGVIgMOGx0hG6m4",
            authDomain: "k-120-fps-method.firebaseapp.com",
            projectId: "k-120-fps-method",
            storageBucket: "k-120-fps-method.firebasestorage.app",
            messagingSenderId: "965540152826",
            appId: "1:965540152826:web:ebf6c26119e8f52dae9043"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let moderatorsData = [];
        let usersData = [];
        let currentMod = null;

        signInAnonymously(auth).catch(err => console.error(err));

        onValue(ref(db, 'moderators'), (snap) => {
            const data = snap.val();
            moderatorsData = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
            checkSession();
        });

        onValue(ref(db, 'app_users'), (snap) => {
            const data = snap.val();
            usersData = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
            renderModUsers();
        });

        function checkSession() {
            const session = sessionStorage.getItem('maruf_mod_session');
            if (session) {
                const parsed = JSON.parse(session);
                // Check against DB (supports updated passwords)
                const valid = moderatorsData.find(m => m.username === parsed.username && m.password === parsed.password);
                if (valid) {
                    currentMod = valid;
                    document.getElementById('modLoginView').classList.add('hidden');
                    document.getElementById('modDashboardView').classList.remove('hidden');
                    document.getElementById('modLogoutBtn').classList.remove('hidden');
                    document.getElementById('loggedInModName').innerText = valid.name || valid.username;
                    renderModUsers();
                }
            }
        }

        window.handleModLogin = function(e) {
            e.preventDefault();
            const u = document.getElementById('modUser').value.trim();
            const p = document.getElementById('modPass').value.trim();
            
            // Default fallback if no moderator created yet in DB
            let found = moderatorsData.find(m => m.username === u && m.password === p);
            if (!found && u === 'moderator1' && p === 'mod123') {
                found = { id: 'default', name: 'Main Moderator', username: 'moderator1', password: 'mod123' };
            }

            if (found) {
                sessionStorage.setItem('maruf_mod_session', JSON.stringify(found));
                checkSession();
                showToast('সফল', 'মডারেটর প্যানেলে প্রবেশ করেছেন।');
            } else {
                document.getElementById('modLoginError').classList.remove('hidden');
            }
        };

        window.logoutModerator = function() {
            sessionStorage.removeItem('maruf_mod_session');
            location.reload();
        };

        window.addUserByMod = async function(e) {
            e.preventDefault();
            if (!currentMod) return;
            const username = document.getElementById('newClientUser').value.trim();
            const password = document.getElementById('newClientPass').value.trim();

            await push(ref(db, 'app_users'), {
                username,
                password,
                addedByRole: 'moderator',
                addedByUsername: currentMod.username,
                createdAt: Date.now()
            });

            document.getElementById('newClientUser').value = '';
            document.getElementById('newClientPass').value = '';
            showToast('সফল', 'নতুন ইউজার সেভ হয়েছে।');
        };

        window.deleteUserByMod = async function(id) {
            const target = usersData.find(u => u.id === id);
            if (!target) return;

            // Strict rule: Moderator can ONLY delete users added by themselves
            if (target.addedByRole === 'admin' || target.addedByUsername !== currentMod.username) {
                showToast('অনুমতি নেই!', 'আপনি শুধুমাত্র নিজের তৈরি করা ইউজার ডিলিট করতে পারবেন।');
                return;
            }

            await remove(ref(db, `app_users/${id}`));
            showToast('ডিলিট', 'ইউজার সফলভাবে মুছে ফেলা হয়েছে।');
        };

        window.updateModPassword = async function(e) {
            e.preventDefault();
            if (!currentMod || currentMod.id === 'default') {
                showToast('ত্রুটি', 'দয়া করে অ্যাডমিন প্যানেল থেকে মডারেটর অ্যাকাউন্ট তৈরি করে নিন।');
                return;
            }
            const newPass = document.getElementById('newModPasswordInput').value.trim();
            await set(ref(db, `moderators/${currentMod.id}/password`), newPass);
            currentMod.password = newPass;
            sessionStorage.setItem('maruf_mod_session', JSON.stringify(currentMod));
            document.getElementById('newModPasswordInput').value = '';
            showToast('সফল', 'মডারেটর পাসওয়ার্ড আপডেট হয়েছে।');
        };

        function renderModUsers() {
            const container = document.getElementById('modUsersList');
            if (!container || !currentMod) return;
            if (usersData.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 col-span-full">কোনো ইউজার নেই।</p>`;
                return;
            }

            container.innerHTML = usersData.map(u => {
                const isMine = u.addedByUsername === currentMod.username;
                const badge = isMine 
                    ? `<span class="text-[9px] text-sky-400 bg-sky-500/10 px-1.5 py-0.5 rounded">আপনার তৈরি</span>` 
                    : `<span class="text-[9px] text-amber-400 bg-amber-500/10 px-1.5 py-0.5 rounded">অন্যান্য/অ্যাডমিন</span>`;

                const deleteBtn = isMine
                    ? `<button onclick="deleteUserByMod('${u.id}')" class="text-rose-400 hover:text-rose-300 p-2"><i class="fa-solid fa-trash"></i></button>`
                    : `<span class="text-slate-600 p-2 cursor-not-allowed" title="ডিলিট করার অনুমতি নেই"><i class="fa-solid fa-lock"></i></span>`;

                return `
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                    <div>
                        <div class="flex items-center gap-1.5">
                            <p class="text-xs font-bold text-white">${escapeHtml(u.username)}</p>
                            ${badge}
                        </div>
                        <p class="text-[11px] text-slate-400 mt-0.5">Pass: ${escapeHtml(u.password)}</p>
                    </div>
                    ${deleteBtn}
                </div>
                `;
            }).join('');
        }

        window.showToast = function(title, message) {
            const box = document.getElementById('toastBox');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMessage').innerText = message;
            box.classList.remove('translate-y-28', 'opacity-0', 'pointer-events-none');
            setTimeout(() => box.classList.add('translate-y-28', 'opacity-0', 'pointer-events-none'), 3000);
        };
        function escapeHtml(str) { return str ? String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;') : ''; }
    </script>
</body>
</html>
